<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBP Administration</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-box">
            <h2>MBP Administration</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required value="admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required value="mbp-admin-2026">
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            <p class="small-text">Default credentials shown above</p>
        </div>
    </div>

    <script>
        // Simple login - auto-fill credentials and submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.querySelector('input[name="username"]').value;
            const password = document.querySelector('input[name="password"]').value;

            // Show attempt
            const btn = document.querySelector('button[type="submit"]');
            btn.textContent = 'Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                btn.textContent = 'Sign In';

                if (data.success) {
                    window.location.href = './dashboard';
                } else {
                    alert('Invalid credentials: ' + data.message);
                }
            } catch (error) {
                btn.textContent = 'Sign In';
                alert('Error connecting to server: ' + error.message);
            }
        });

        // Auto-focus username field
        document.querySelector('input[name="username"]').focus();
    </script>
</body>
</html>
